<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String plan - GO4</title>
    <link rel="stylesheet" href="/editor/editor.css">
</head>
<body>

    <div class="traka">
        <span class="logo">GO4</span>

        <div class="veza-stranica">
            <a href="/plan" class="tekuca">String plan</a>
            <a href="/editor">Jednopolna</a>
        </div>

        <input type="text" id="naziv" placeholder="Naziv plana">

        <select id="format" title="Format lista">
            <option value="A4-landscape">A4 pejzaž</option>
            <option value="A4-portrait">A4 portret</option>
            <option value="A3-landscape">A3 pejzaž</option>
            <option value="A3-portrait">A3 portret</option>
        </select>

        <div class="grupa">
            <button id="btn-undo" title="Ctrl+Z">↶</button>
            <button id="btn-redo" title="Ctrl+Shift+Z">↷</button>
        </div>

        <div class="grupa">
            <button id="btn-zoom-minus" title="Umanji">−</button>
            <button id="btn-zoom-plus" title="Uvećaj">+</button>
            <button id="btn-uklopi">Uklopi</button>
        </div>

        <span class="razmak"></span>

        <div class="grupa" id="alati"></div>
        <select id="tip-opreme" title="Šta postavlja alat Oprema"></select>

        <label class="prekidac" title="Prikaz trasa kablova na crtežu">
            <input type="checkbox" id="prikazi-trase" checked> Trase
        </label>

        <button id="btn-polje">+ Krovna ravan</button>
        <button id="btn-jednopolna" class="istaknuto">⚡ Jednopolna iz plana</button>

        <div class="grupa">
            <button id="btn-svg">SVG</button>
            <button id="btn-png">PNG</button>
            <button id="btn-pdf">PDF / štampa</button>
        </div>

        <button id="btn-snimi" class="primarno">Snimi</button>
    </div>

    <div class="radna plan">
        <main id="platno">
            <div id="crtez"></div>
            <div id="status">—</div>
            <div id="alat-opis"></div>
            <div class="pomoc">
                <b>Shift</b>+prevlačenje ili srednji taster = pomeranje pogleda · točkić = zum<br>
                <b>R</b> rotira krovnu ravan za 15° (Shift+R nazad) · <b>Delete</b> briše
            </div>
        </main>

        <aside class="bocni desno" id="svojstva"></aside>
    </div>

    <div class="poruka" id="poruka"></div>

    <script type="module" src="/editor/js/plan-app.js"></script>
</body>
</html>
